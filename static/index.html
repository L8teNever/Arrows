<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
  <title>Arrows</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></symbol>
    <symbol id="i-dark" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></symbol>
    <symbol id="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M6 6v2h8.59L5 17.59 6.41 19 16 9.41V18h2V6z"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19a7 7 0 0 0-4 12.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26A7 7 0 0 0 12 2z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></symbol>
  </svg>
  <header class="top-app-bar">
    <button class="icon-btn" id="btn-levels" aria-label="Level wählen"><svg class="ic"><use href="#i-grid"/></svg></button>
    <div class="title">
      <span class="headline">Level <span id="level-no">1</span></span>
      <span class="sub" id="level-info"></span>
    </div>
    <button class="icon-btn" id="btn-theme" aria-label="Design wechseln"><svg class="ic"><use href="#i-dark"/></svg></button>
  </header>

  <section class="status">
    <div class="hearts" id="hearts" aria-label="Leben"></div>
    <div class="chips">
      <div class="chip big" id="big-chip" hidden><svg class="ic"><use href="#i-star"/></svg><span id="big-text"></span></div>
      <div class="chip"><svg class="ic"><use href="#i-out"/></svg><span id="left">0</span> übrig</div>
    </div>
  </section>

  <main class="board-wrap">
    <div class="board-card">
      <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </main>

  <nav class="actions">
    <button class="btn tonal" id="btn-restart"><svg class="ic"><use href="#i-restart"/></svg>Neu starten</button>
    <button class="fab" id="btn-hint" aria-label="Tipp"><svg class="ic"><use href="#i-bulb"/></svg></button>
    <button class="btn tonal" id="btn-levels2"><svg class="ic"><use href="#i-list"/></svg>Level</button>
  </nav>

  <div class="snackbar" id="snackbar" role="status"></div>

  <dialog id="dlg-win">
    <svg class="ic dlg-icon"><use href="#i-star"/></svg>
    <h2>Level geschafft!</h2>
    <p id="win-text"></p>
    <div class="dlg-actions">
      <button class="btn text" id="win-replay">Nochmal</button>
      <button class="btn filled" id="win-next">Weiter</button>
    </div>
  </dialog>

  <dialog id="dlg-lose">
    <svg class="ic dlg-icon err"><use href="#i-heart"/></svg>
    <h2>Keine Leben mehr</h2>
    <p>Die Pfeile haben sich verhakt. Probier's nochmal.</p>
    <div class="dlg-actions">
      <button class="btn filled" id="lose-retry">Nochmal versuchen</button>
    </div>
  </dialog>

  <dialog id="dlg-levels">
    <h2>Level wählen</h2>
    <p>Freigeschaltet bis Level <b id="max-level">1</b></p>
    <label class="field">
      <span>Levelnummer</span>
      <input type="number" id="level-input" min="1" inputmode="numeric">
    </label>
    <div class="dlg-actions">
      <button class="btn text" id="levels-cancel">Abbrechen</button>
      <button class="btn filled" id="levels-go">Spielen</button>
    </div>
  </dialog>

  <script src="/static/app.js" defer></script>
</body>
</html>
